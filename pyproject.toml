[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-monitor"
version = "0.2.0"
description = "CLI tool for homelab health monitoring"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "psutil>=5.9.0",
    "docker>=7.2.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# BLE001: Allow blind exception catches — monitoring tool must be resilient
ignore = ["BLE001"]
