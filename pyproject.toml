[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-monitor"
version = "0.2.0"
description = "CLI tool for homelab health monitoring"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "psutil>=5.9.0",
    "docker>=7.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
